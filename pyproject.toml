[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymack"
dynamic = ["version"]
description = "Local linear stability solver for compressible and hypersonic boundary layers — Mack modes, growth rates, neutral curves, N-factors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mert Senkardesler", email = "mert.senkardesler@gmail.com" }]
keywords = [
    "linear-stability-theory", "lst", "boundary-layer", "transition",
    "hypersonic", "compressible-flow", "mack-mode", "second-mode",
    "orr-sommerfeld", "neutral-curve", "n-factor", "cfd", "fluid-dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# In-development GPU batch-sweep engine (docs/gpu/PLAN.md). NEVER required by
# `import pymack` -- GPU is an upgrade, not a requirement (see README.md,
# "Batch sweeps" and docs/SWEEP_API.md). Match the CUDA major version to your
# runtime; on some environments cupy-cuda12x transitively pulls the
# nvidia-*-cu12 meta-packages (e.g. nvidia-cublas-cu12), which can duplicate
# CUDA libraries already provided by your driver/toolkit -- if that happens,
# install a CuPy wheel matching your system CUDA instead
# (https://docs.cupy.dev/en/stable/install.html).
gpu = ["cupy-cuda12x"]

[project.urls]
Homepage = "https://github.com/BARDAK1995/pymack"
Repository = "https://github.com/BARDAK1995/pymack"
Issues = "https://github.com/BARDAK1995/pymack/issues"

[tool.hatch.build.targets.wheel]
packages = ["pymack"]

[tool.hatch.version]
path = "pymack/__init__.py"

[tool.pytest.ini_options]
testpaths = ["validation"]
markers = [
    "slow: long-running benchmark tests (deselect with '-m \"not slow\"')",
    "gpu: device tests requiring CuPy + a CUDA GPU (select with '-m gpu'; also marked slow so the GPU-less fast suite '-m \"not slow\"' skips them)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Legacy engine modules predate the import-order convention; new code follows it.
"pymack/{analysis,solver,mack_shooting,baseflow,boundary_layer}.py" = ["I001"]
# The top-level namespace groups imports by architectural layer on purpose.
"pymack/__init__.py" = ["I001", "E402"]
